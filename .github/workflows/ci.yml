name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Tests and lints (native crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit and integration tests
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release -p fn-core -p fn-shaders

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (wasm crate)
        run: cargo clippy -p fn-web --target wasm32-unknown-unknown --release
      - name: Cache wasm-bindgen
        id: wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129
      - name: Install wasm-bindgen-cli (must match the wasm-bindgen crate version)
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the site
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
