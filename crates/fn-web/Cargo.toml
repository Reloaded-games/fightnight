[package]
name = "fn-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fn-core = { path = "../fn-core" }
fn-shaders = { path = "../fn-shaders" }
glam = { workspace = true }
bytemuck = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "console", "Performance",
  "CanvasRenderingContext2d", "KeyboardEvent", "MouseEvent", "WheelEvent", "Event", "EventTarget",
  "PointerEvent", "FocusEvent", "ResizeObserver", "ResizeObserverEntry", "DomRect", "CssStyleDeclaration",
  "Location", "UrlSearchParams", "Storage", "HtmlInputElement", "AudioContext", "AudioBuffer",
  "AudioBufferSourceNode", "AudioDestinationNode", "GainNode", "AudioParam", "AudioNode", "BiquadFilterNode",
  "StereoPannerNode", "AudioContextState", "BiquadFilterType", "DocumentFragment", "Node", "NodeList", "ImageData",
  "Path2d", "TextMetrics", "HtmlCollection", "DomTokenList", "AddEventListenerOptions", "Gamepad",
] }
